name: CI - Deployment Stack Validation

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  docker-compose-validate:
    name: Docker Compose Syntax & Service Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate Docker Compose Configuration
        run: docker compose config -q

      - name: Verify Docker Hub Multi-Arch Image
        run: |
          docker pull mozhenbear/securemail-web:latest
