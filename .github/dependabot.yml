version: 2
updates:
  # Maintain Dockerfiles
  - package-ecosystem: "docker"
    directory: "/docker/postfix"
    schedule:
      interval: "weekly"

  - package-ecosystem: "docker"
    directory: "/docker/dovecot"
    schedule:
      interval: "weekly"

  # Maintain GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
