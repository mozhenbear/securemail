# Dovecot main configuration

protocols = imap pop3 lmtp
listen = *

# Disable SSL for internal container network
ssl = no
disable_plaintext_auth = no

# Mail location: Maildir format under /var/mail/vhosts/%u
mail_location = maildir:/var/mail/vhosts/%u
mail_uid = 5000
mail_gid = 5000
mail_privileged_group = vmail
recipient_delimiter = +

# Standard Mailboxes & Namespaces
namespace inbox {
  inbox = yes
  separator = /

  mailbox INBOX {
    auto = create
  }
  mailbox Sent {
    special_use = \Sent
    auto = create
  }
  mailbox Drafts {
    special_use = \Drafts
    auto = create
  }
  mailbox Trash {
    special_use = \Trash
    auto = create
  }
  mailbox Junk {
    special_use = \Junk
    auto = create
  }
}

# Authentication
auth_mechanisms = plain login

passdb {
  driver = sql
  args = /etc/dovecot/dovecot-sql.conf.ext
}

userdb {
  driver = sql
  args = /etc/dovecot/dovecot-sql.conf.ext
}

# Services
service imap-login {
  inet_listener imap {
    port = 143
  }
}

service pop3-login {
  inet_listener pop3 {
    port = 110
  }
}

service lmtp {
  inet_listener lmtp {
    port = 24
  }
}

# SASL Auth socket for Postfix
service auth {
  inet_listener auth {
    port = 10000
  }
}

# Logging
log_path = /dev/stdout
info_log_path = /dev/stdout
debug_log_path = /dev/stdout
